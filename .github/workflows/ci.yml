name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public contents
        run: python tools/check_release.py
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium
      - name: Check browser scripts
        run: |
          node --check web/app.js
          node --check closed_review_web/app.js
      - name: Test without contest data or credentials
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q -rs
